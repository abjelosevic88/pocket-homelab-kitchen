name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-kitchen ./cmd/pocket-kitchen
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pk DEMO_DATA=true AUTH_MODE=none OPENFOODFACTS=false ./pocket-kitchen &
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/dashboard | grep -q shopping_open
          curl -fsS http://localhost:8080/api/v1/recipes/1 | grep -q '"ingredients"'
          curl -fsS -X POST http://localhost:8080/api/v1/plan/shop -H 'Content-Type: application/json' -d '{"skip_pantry":true}' | grep -q '"added"'
          curl -fsS -X POST http://localhost:8080/api/v1/recipes/2/cook -H 'Content-Type: application/json' -d '{}' | grep -q '"deducted"'
          curl -fsS -X POST http://localhost:8080/api/v1/lists/1/items -H 'Content-Type: application/json' -d '{"name":"2 kg potatoes"}' | grep -q '"unit":"kg"'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-kitchen:pr
